services:
  yolo-inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8000"
    env_file:
      - .docker.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: yolo-inference-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=soat
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    volumes:
      - ./models:/app/models
    networks:
      - default
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://localhost:8000/openapi.json > /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  default:
    external: true
    name: soat-net
