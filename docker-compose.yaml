services:
  yolo-inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .docker.env
    volumes:
      - ./models:/app/models
    networks:
      - default
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://localhost:8000/openapi.json > /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  default:
    external: true
    name: soat-net
